services:
  mysql:
    image: mysql:8.0
    container_name: stackfood_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stackfood
      MYSQL_USER: stackfood
      MYSQL_PASSWORD: stackfood
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stackfood_redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: stackfood_mailhog
    restart: unless-stopped
    ports:
      - '8025:8025'

  app:
    build:
      context: './Main panels- user app and web'
      dockerfile: './docker/php-fpm/Dockerfile'
    container_name: stackfood_app
    restart: unless-stopped
    env_file:
      - './Main panels- user app and web/.env.docker'
    environment:
      RUN_MIGRATIONS: 'true'
    volumes:
      - './Main panels- user app and web:/var/www/html:z'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: './Main panels- user app and web'
      dockerfile: './docker/php-fpm/Dockerfile'
    container_name: stackfood_worker
    restart: unless-stopped
    env_file:
      - './Main panels- user app and web/.env.docker'
    environment:
      RUN_MIGRATIONS: 'false'
    command: ['php', 'artisan', 'queue:work', '--sleep=3', '--tries=3', '--timeout=90']
    volumes:
      - './Main panels- user app and web:/var/www/html:z'
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started

  scheduler:
    build:
      context: './Main panels- user app and web'
      dockerfile: './docker/php-fpm/Dockerfile'
    container_name: stackfood_scheduler
    restart: unless-stopped
    env_file:
      - './Main panels- user app and web/.env.docker'
    environment:
      RUN_MIGRATIONS: 'false'
    command: ['php', 'artisan', 'schedule:work']
    volumes:
      - './Main panels- user app and web:/var/www/html:z'
    depends_on:
      app:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: stackfood_nginx
    user: "0:0"
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - './Main panels- user app and web:/var/www/html:ro,z'
      - './docker/backend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
    depends_on:
      app:
        condition: service_started

  stackfood-react:
    build:
      context: './StackFood React'
      dockerfile: './docker/Dockerfile'
    container_name: stackfood_react
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_BASE_URL: 'http://localhost:8080'
      INTERNAL_API_BASE_URL: 'http://nginx'
      NEXT_CLIENT_HOST_URL: 'http://localhost:3000'
      NEXT_PUBLIC_SITE_VERSION: '3.7'
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - './StackFood React:/app'
      - react_node_modules:/app/node_modules
      - react_next_cache:/app/.next
    depends_on:
      nginx:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  react_node_modules:
  react_next_cache:
